<div class="enr-resp-container">
  <div class="enr-resp-panel">
    <form id="enr-resp-frm" class="enr-resp-form">
      <div class="enr-resp-header">
        <h3 class="enr-resp-title">Consulta de respuestas</h3>
        <p class="enr-resp-subtitle">
          Introduce tu número de cédula para ver el estado de tus solicitudes.
        </p>
      </div>
      <div class="enr-resp-search-row">
        <input
          id="enr-resp-frm-ssn"
          class="enr-resp-input"
          name="ssn"
          type="text"
          placeholder="Introduce tu número de cédula de identidad"
        />
        <button
          id="enr-resp-frm-submit-btn"
          type="submit"
          class="enr-resp-button et_pb_button"
        >
          Buscar
        </button>
      </div>
      <div
        id="enr-resp-frm-error-message"
        class="enr-resp-alert enr-resp-alert--error"
        style="display: none"
      ></div>
    </form>
  </div>
  <img
    id="enr-resp-loader"
    class="enr-resp-loader"
    src="https://ingenieria.ucab.edu.ve/informatica/wp-content/uploads/sites/4/2019/07/popup_loading.gif"
    style="display: none"
  />
  <div id="enr-resp-result" class="enr-resp-results"></div>
</div>
<script>
  ((jQuery) => {
    const SUPABASE_URL = "https://zmvecicbbxbpuhbnexiz.supabase.co";
    const SUPABASE_KEY = "sb_publishable_tLbqOISGtoE-_0lEsqxuXQ_YYRaT59G";
    let sbClient = null;

    const invalidSsn =
      "Debes introducir un número de cédula de identidad válido.";
    const notFound =
      "No se encontró ninguna información asociada a la cédula de identidad N° <strong>@SSN@</strong>.";
    const generalError =
      "Hubo un error inesperado al intentar obtener la información. Intenta más tarde&hellip;";
    const consent =
      "Autorizo a cambiar mi horario para poder inscribir las asignaturas indicadas.";
    const noConsent = "No autorizo a realizar ningún cambio en mi horario.";

    function initSupabase() {
      if (sbClient) return sbClient;
      if (window.supabase && window.supabase.createClient) {
        sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
      } else if (typeof createClient !== "undefined") {
        sbClient = createClient(SUPABASE_URL, SUPABASE_KEY);
      }
      return sbClient;
    }

    jQuery(() => {
      const $frm = jQuery("#enr-resp-frm");
      const $ssn = jQuery("#enr-resp-frm-ssn");
      const $resultsContainer = jQuery("#enr-resp-result");
      const $errMsg = jQuery("#enr-resp-frm-error-message");
      const $loader = jQuery("#enr-resp-loader");
      const SPEED = 250;

      let ssn = null;
      $frm.on(
        "click",
        "#enr-resp-frm-submit-btn",
        handleEnrollmentRespSsnSearchButtonClick,
      );

      function validateSsn(ssn) {
        const matched = ssn.trim().match(/^(?:AS){0,1}(\d+)$/i);
        return matched !== null;
      }

      function handleEnrollmentRespSsnSearchButtonClick(evt) {
        evt.preventDefault();

        if (ssn !== $ssn.val()) {
          ssn = $ssn.val();

          if (ssn) {
            if (!validateSsn(ssn)) {
              hideLoader(invalidSsn);
            } else {
              showLoader();
              fetchData(ssn);
            }
          } else {
            hideLoader(invalidSsn);
          }
        }
      }

      function hideLoader(msg) {
        if (msg) {
          $loader.fadeOut(SPEED, () => {
            $resultsContainer.fadeOut(SPEED, () => {
              $errMsg
                .html(
                  `<span class="enr-resp-alert-icon" aria-hidden="true">⚠️</span><span class="enr-resp-alert-text">${msg}</span>`,
                )
                .fadeIn();
            });
          });
        } else {
          $loader.fadeOut(SPEED, () => $resultsContainer.fadeIn());
        }
      }

      function showLoader() {
        $resultsContainer.fadeOut(SPEED, () => {
          $errMsg.fadeOut(SPEED, () => $loader.fadeIn());
        });
      }

      async function fetchData(ssn) {
        try {
          const client = initSupabase();
          if (!client) {
            hideLoader(generalError);
            return;
          }

          const { data, error } = await client.rpc("get_enrollment_responses", {
            p_cedula: ssn,
          });

          if (error) throw error;

          $resultsContainer.empty();
          hideLoader();

          renderMessages(data || []);
        } catch (err) {
          console.error(err);
          hideLoader(generalError);
        }
      }

      function renderMessages(data) {
        if (data && data.length > 0) {
          const filteredRows = data.filter(
            (row) => row.status !== "IGNORADO" && row.status !== "REPETIDO",
          );

          filteredRows.forEach((row) => {
            const submittedAt = new Date(row.submitted_at).toLocaleString(
              "es-VE",
              {
                dateStyle: "full",
                timeStyle: "short",
              },
            );

            let statusEmoji = "⏳";
            let statusClass = "enr-resp-status--pending";
            let statusText = "En proceso";

            if (row.status === "EN REVISIÓN" || row.status === "POR REVISAR") {
              statusEmoji = "⏳";
              statusClass = "enr-resp-status--pending";
              statusText = "En proceso";
            } else if (
              row.status === "IGNORADO" ||
              row.status === "NO PROCEDE" ||
              row.status === "REPETIDO" ||
              row.status === "REVISADO" ||
              row.status === "SOLUCIONADO"
            ) {
              statusEmoji = "✔️";
              statusClass = "enr-resp-status--success";
              statusText = "Procesada";
            }

            const responseText = row.respuesta
              ? row.respuesta.replace(/\n/g, "<br/>")
              : row.status === "SOLUCIONADO" || row.status === "NO PROCEDE"
                ? ""
                : "Actualmente nos encontramos procesando tu solicitud. Estaremos dándote respuesta a la brevedad.";

            const $card = jQuery("<div>").addClass(
              "enr-resp-card enr-resp-card--response",
            );
            const $header = jQuery("<div>").addClass(
              "enr-resp-card-header enr-resp-card-header--row",
            );
            const $title = jQuery("<div>")
              .addClass("enr-resp-card-title")
              .text(`${row.student_name} - ${row.student_cedula}`);
            const $status = jQuery("<div>")
              .addClass(`enr-resp-status ${statusClass}`)
              .html(`${statusEmoji} ${statusText}`);
            const $meta = jQuery("<div>")
              .addClass("enr-resp-card-meta")
              .text(submittedAt);

            $header.append($title, $status, $meta);

            const $requestField = jQuery("<div>").addClass("enr-resp-field");
            const requestText = `${row.accion || ""} "${row.materia || ""}"${row.nrc ? ` (sugiero el NRC ${row.nrc})` : ""}`;
            $requestField.append(
              jQuery("<div>")
                .addClass("enr-resp-field-label")
                .text("Comentario de observacion"),
              jQuery("<div>")
                .addClass("enr-resp-field-value")
                .html(
                  row.comentarios
                    ? row.comentarios.replace(/\n/g, "<br/>")
                    : "<em>¡No dejé comentarios u observaciones!</em>",
                ),
            );

            const $subjectField = jQuery("<div>").addClass("enr-resp-field");
            const actionLabel = row.accion
              ? row.accion.charAt(0).toUpperCase() + row.accion.slice(1)
              : "Solicitud";
            const subjectText = row.materia
              ? `<strong>${actionLabel}</strong>: ${row.materia}`
              : "<em>No aplica</em>";
            const nrcText = row.nrc ? ` (NRC: ${row.nrc})` : "";
            $subjectField.append(
              jQuery("<div>").addClass("enr-resp-field-label").text("Materia"),
              jQuery("<div>")
                .addClass("enr-resp-field-value")
                .html(`${subjectText}${nrcText}`),
            );

            const $responseField = jQuery("<div>").addClass("enr-resp-field");
            $responseField.append(
              jQuery("<div>")
                .addClass("enr-resp-field-label")
                .text("Respuesta"),
              jQuery("<div>")
                .addClass("enr-resp-field-value")
                .html(responseText || "<em>Sin respuesta registrada.</em>"),
            );

            $card.append($header, $requestField, $subjectField, $responseField);

            if (row.autoriza || row.accion || row.materia || row.nrc) {
              const consentText = row.autoriza === "SÍ" ? consent : noConsent;
              $card.append(
                jQuery("<div>").addClass("enr-resp-consent").text(consentText),
              );
            }

            $resultsContainer.append($card);
          });
        } else {
          $resultsContainer.append(
            `<div class="enr-resp-alert enr-resp-alert--error"><span class="enr-resp-alert-icon" aria-hidden="true">⚠️</span><span class="enr-resp-alert-text">${notFound.replace("@SSN@", ssn)}</span></div>`,
          );
        }
      }
    });
  })(jQuery);
</script>
